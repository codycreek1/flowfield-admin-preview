<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/flowfield-admin-preview/favicon.svg" />
    <link rel="apple-touch-icon" href="/flowfield-admin-preview/icons/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(display-mode: standalone)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Admin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="FlowField Pro Admin is the operator console for customer contacts and subscription health."
    />
    <title>FlowField Pro Admin</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('flowfield-admin.theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var chrome = dark ? '#0b1220' : '#f8fafc'
          document.documentElement.style.backgroundColor = chrome
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', chrome)
          var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          if (standalone) document.documentElement.classList.add('ff-standalone')
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="/flowfield-admin-preview/assets/index-C9KfD6Uq.js"></script>
    <link rel="stylesheet" crossorigin href="/flowfield-admin-preview/assets/index-qjtqzD7m.css">
  <link rel="manifest" href="/flowfield-admin-preview/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>
</html>
